server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1 MB default is below the app's own 5 MB upload limit - without
    # raising it here, nginx itself would 413 uploads the API would accept.
    # (Third client, same fix - we knew to check for this by now.)
    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }
}

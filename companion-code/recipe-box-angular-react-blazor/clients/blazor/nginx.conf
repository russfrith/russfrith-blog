server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blazor's runtime and assemblies publish as .wasm (Webcil, since .NET
    # 8) and need application/wasm for streaming instantiation. This block
    # replaces the inherited MIME map for just this path, so it lists
    # exactly what _framework holds (confirmed by inspecting a real publish
    # output: only .wasm/.js, plus their precompressed .gz/.br siblings -
    # no .json/.pdb in this app). A missing file 404s instead of falling
    # back to index.html and producing a confusing runtime error.
    location /_framework/ {
        types {
            application/wasm wasm;
            text/javascript  js mjs;
        }
        default_type application/octet-stream;
        gzip_static on;
        try_files $uri =404;
    }

    # nginx's 1 MB default is below the app's own 5 MB upload limit -
    # without raising it here, nginx itself would 413 uploads the API
    # would accept (same fix Angular's nginx.conf needed in Phase 2).
    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }
}

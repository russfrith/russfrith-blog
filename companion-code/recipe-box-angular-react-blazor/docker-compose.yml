services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ConnectionStrings__RecipeBox: Data Source=/data/recipebox.db
      Storage__SeedRoot: /app/seed
      Storage__ImageRoot: /data/images
    volumes:
      - recipebox-data:/data
    ports:
      - "5080:8080"

volumes:
  recipebox-data:

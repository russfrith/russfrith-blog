services:
  # Dev-only build/test/EF loop: `docker compose -f docker-compose.yml -f
  # docker-compose.dev.yml run --rm dotnet dotnet test ...`. Source is bind-mounted
  # for iteration; bin/obj/the NuGet cache live in named volumes so nothing
  # generated lands in the working tree.
  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      Storage__SeedRoot: /workspace/seed
      Storage__ImageRoot: /tmp/recipebox-images
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
      - shared-bin:/workspace/shared/RecipeBox.Shared/bin
      - shared-obj:/workspace/shared/RecipeBox.Shared/obj
      - shared-tests-bin:/workspace/shared/RecipeBox.Shared.Tests/bin
      - shared-tests-obj:/workspace/shared/RecipeBox.Shared.Tests/obj
      - api-bin:/workspace/api/RecipeBox.Api/bin
      - api-obj:/workspace/api/RecipeBox.Api/obj
      - api-tests-bin:/workspace/api/RecipeBox.Api.Tests/bin
      - api-tests-obj:/workspace/api/RecipeBox.Api.Tests/obj

  typegen:
    build:
      context: .
      dockerfile: tools/typegen/Dockerfile
    profiles: ["tools"]
    working_dir: /app
    volumes:
      - ./tools/typegen:/app
      - typegen-node-modules:/app/node_modules
      # generate.sh resolves "../../api/openapi.json" relative to /app; only
      # this one file (read-only) is exposed, not the whole repo.
      - ./api/openapi.json:/api/openapi.json:ro
      # Output mount for the Angular client's generated types. Same
      # "../../" relative-path trick: from /app, "../../clients/angular/..."
      # resolves to "/clients/angular/...", which this volume backs.
      - ./clients/angular/src/app/api:/clients/angular/src/app/api

  # Dev-only Angular loop: `docker compose -f docker-compose.yml -f
  # docker-compose.dev.yml run --rm ng npx ng test --watch=false`, or
  # `... up ng` to serve with live reload. node_modules and the build
  # cache live in named volumes nested under the bind mount, so the
  # `npm ci` already baked into the `deps` image stage at /app/node_modules
  # seeds the volume on first creation (same trick as the typegen service
  # above). shared/test-vectors.json is mounted read-only at the exact
  # relative path quantities.spec.ts expects (4 levels up from
  # /app/src/app) so it can import the file directly.
  ng:
    build:
      context: ./clients/angular
      dockerfile: Dockerfile
      target: deps
    profiles: ["tools"]
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./clients/angular:/app
      - angular-node-modules:/app/node_modules
      - angular-cache:/app/.angular
      - ./shared/test-vectors.json:/shared/test-vectors.json:ro
    command: npx ng serve --host 0.0.0.0 --poll 1000 --proxy-config proxy.conf.json

volumes:
  angular-node-modules:
  angular-cache:
  nuget-cache:
  shared-bin:
  shared-obj:
  shared-tests-bin:
  shared-tests-obj:
  api-bin:
  api-obj:
  api-tests-bin:
  api-tests-obj:
  typegen-node-modules:

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - orders-pg-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  migrate-and-seed:
    build:
      context: .
      dockerfile: Dockerfile.migrate-and-seed
    environment:
      ORDERS_DB_CONNECTION: "Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ConnectionStrings__OrdersDb: "Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      ORDERS_TEST_DB_CONNECTION: "Host=postgres;Port=5432;Database=orders_test;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tests"]

  benchmarks:
    build:
      context: .
      dockerfile: Dockerfile.benchmarks
    command: ["--filter", "*"]
    environment:
      ORDERS_DB_CONNECTION: "Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres"
    volumes:
      - ./benchmark-results:/src/Benchmarks/BenchmarkDotNet.Artifacts/results
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    profiles: ["benchmarks"]

volumes:
  orders-pg-data:

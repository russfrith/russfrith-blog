services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: repository_pattern
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

  migrate-and-seed:
    build:
      context: .
      dockerfile: Dockerfile.migrate-and-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Orders: "Host=postgres;Database=repository_pattern;Username=postgres;Password=postgres"
      SEED_ORDER_COUNT: "50000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Orders: "Host=postgres;Database=repository_pattern;Username=postgres;Password=postgres"

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DB_CONNECTION_STRING: "Host=postgres;Database=repository_pattern_test;Username=postgres;Password=postgres"

volumes:
  postgres-data:

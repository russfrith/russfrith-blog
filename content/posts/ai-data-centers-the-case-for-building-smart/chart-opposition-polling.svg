<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="719" height="319" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>

  <text x="28" y="36" font-size="19" font-weight="600" fill="#0b0b0b">Opposition runs high across every recent poll</text>
  <text x="28" y="57" font-size="13" fill="#52514e">Share of US adults opposed to new AI data centers, or supporting a pause</text>

  <!-- gridlines -->
  <line x1="230" y1="90" x2="230" y2="290" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="330" y1="90" x2="330" y2="290" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="430" y1="90" x2="430" y2="290" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="530" y1="90" x2="530" y2="290" stroke="#e1e0d9" stroke-width="1"/>
  <line x1="630" y1="90" x2="630" y2="290" stroke="#e1e0d9" stroke-width="1"/>

  <text x="230" y="304" font-size="11" fill="#898781" text-anchor="middle">0%</text>
  <text x="330" y="304" font-size="11" fill="#898781" text-anchor="middle">25%</text>
  <text x="430" y="304" font-size="11" fill="#898781" text-anchor="middle">50%</text>
  <text x="530" y="304" font-size="11" fill="#898781" text-anchor="middle">75%</text>
  <text x="630" y="304" font-size="11" fill="#898781" text-anchor="middle">100%</text>

  <!-- Row 1: Gallup 71% -->
  <path d="M 230 98 L 510 98 Q 514 98 514 102 L 514 118 Q 514 122 510 122 L 230 122 Z" fill="#2a78d6"/>
  <text x="522" y="114" font-size="14" font-weight="700" fill="#0b0b0b">71%</text>
  <text x="222" y="106" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">Gallup</text>
  <text x="222" y="120" font-size="11" fill="#52514e" text-anchor="end">Mar 2026 &#183; oppose a center nearby</text>

  <!-- Row 2: Data for Progress 63% -->
  <path d="M 230 173 L 478 173 Q 482 173 482 177 L 482 193 Q 482 197 478 197 L 230 197 Z" fill="#2a78d6"/>
  <text x="490" y="189" font-size="14" font-weight="700" fill="#0b0b0b">63%</text>
  <text x="222" y="181" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">Data for Progress</text>
  <text x="222" y="195" font-size="11" fill="#52514e" text-anchor="end">Jun 2026 &#183; support 1-yr pause</text>

  <!-- Row 3: Reuters/Ipsos 59% -->
  <path d="M 230 248 L 462 248 Q 466 248 466 252 L 466 268 Q 466 272 462 272 L 230 272 Z" fill="#2a78d6"/>
  <text x="474" y="264" font-size="14" font-weight="700" fill="#0b0b0b">59%</text>
  <text x="222" y="256" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">Reuters/Ipsos</text>
  <text x="222" y="270" font-size="11" fill="#52514e" text-anchor="end">Jun 2026 &#183; oppose within 10 mi</text>

  <text x="28" y="312" font-size="10" fill="#898781">Sources: Gallup; Data for Progress; Reuters/Ipsos. Each poll asked a different question; methodologies are not identical.</text>
</svg>

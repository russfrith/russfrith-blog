<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0.5" y="0.5" width="719" height="229" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>

  <text x="28" y="34" font-size="19" font-weight="600" fill="#0b0b0b">Closed-loop cooling cuts water use dramatically</text>
  <text x="28" y="55" font-size="13" fill="#52514e">Two water-saving cooling designs already operating today</text>

  <line x1="380" y1="70" x2="380" y2="196" stroke="#e1e0d9" stroke-width="1"/>

  <!-- Left: Novva 84% reduction -->
  <text x="40" y="80" font-size="11" font-weight="600" fill="#898781" letter-spacing="0.5">NOVVA DATA CENTER &#183; UTAH</text>
  <text x="40" y="150" font-size="60" font-weight="700" fill="#0ca30c">84%</text>
  <text x="40" y="176" font-size="13" fill="#52514e">lower water use than the</text>
  <text x="40" y="194" font-size="13" fill="#52514e">conventional design it replaced</text>

  <!-- Right: Stargate recurring use -->
  <text x="410" y="80" font-size="11" font-weight="600" fill="#898781" letter-spacing="0.5">OPENAI / ORACLE STARGATE SITES</text>
  <text x="410" y="140" font-size="34" font-weight="700" fill="#0b0b0b">~12,000 gal/yr</text>
  <text x="410" y="162" font-size="13" fill="#52514e">per building, after an initial</text>
  <text x="410" y="180" font-size="13" fill="#52514e">~1 million-gallon municipal fill</text>

  <text x="28" y="214" font-size="10" fill="#898781">Sources: ConvergeDigest (Novva); Epoch AI (OpenAI Stargate sites). Figures are developer-stated, not independently audited.</text>
</svg>

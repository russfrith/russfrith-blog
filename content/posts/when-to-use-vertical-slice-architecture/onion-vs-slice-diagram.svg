<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="diagram-title diagram-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="diagram-title">One feature, two groupings</title>
  <desc id="diagram-desc">The apply-discount-code feature in Onion architecture is spread across four rings: Api, Infrastructure, Application, and Domain, each contributing one file. In vertical slice architecture, the same feature's five files sit together in one folder.</desc>

  <rect x="0" y="0" width="800" height="360" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1" />

  <!-- Onion side -->
  <text x="30" y="36" font-size="15" font-weight="700" fill="#0b0b0b">Onion: one feature, four rings</text>

  <g filter="none">
    <rect x="30" y="56" width="320" height="56" rx="8" fill="#f3f1ec" stroke="#b8b5ac" stroke-width="2" />
    <rect x="30" y="118" width="320" height="56" rx="8" fill="#f3f1ec" stroke="#b8b5ac" stroke-width="2" />
    <rect x="30" y="180" width="320" height="56" rx="8" fill="#f3f1ec" stroke="#b8b5ac" stroke-width="2" />
    <rect x="30" y="242" width="320" height="56" rx="8" fill="#f3f1ec" stroke="#b8b5ac" stroke-width="2" />
  </g>

  <text x="44" y="72" font-size="12" font-weight="700" fill="#52514e">API</text>
  <text x="44" y="134" font-size="12" font-weight="700" fill="#52514e">INFRASTRUCTURE</text>
  <text x="44" y="196" font-size="12" font-weight="700" fill="#52514e">APPLICATION</text>
  <text x="44" y="258" font-size="12" font-weight="700" fill="#52514e">DOMAIN</text>

  <g>
    <rect x="44" y="76" width="180" height="28" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2.5" />
    <rect x="44" y="138" width="200" height="28" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2.5" />
    <rect x="44" y="200" width="210" height="28" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2.5" />
    <rect x="44" y="262" width="230" height="28" rx="6" fill="#cde2fb" stroke="#2a78d6" stroke-width="2.5" />
  </g>

  <text x="134" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">POST /discount-code</text>
  <text x="144" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">OrderRepository.cs</text>
  <text x="149" y="219" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">ApplyDiscountCodeHandler.cs</text>
  <text x="159" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Order.ApplyDiscountCode()</text>

  <line x1="134" y1="104" x2="144" y2="138" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="144" y1="166" x2="149" y2="200" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="149" y1="228" x2="159" y2="262" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Vertical slice side -->
  <text x="430" y="36" font-size="15" font-weight="700" fill="#0b0b0b">Vertical slice: one feature, one folder</text>

  <rect x="430" y="56" width="340" height="256" rx="8" fill="#f3f1ec" stroke="#b8b5ac" stroke-width="2" />
  <text x="444" y="78" font-size="12" font-weight="700" fill="#52514e">FEATURES/ORDERS/APPLYDISCOUNTCODE/</text>

  <g>
    <rect x="444" y="92" width="300" height="32" rx="6" fill="#c6ebde" stroke="#1baf7a" stroke-width="2.5" />
    <rect x="444" y="134" width="300" height="32" rx="6" fill="#c6ebde" stroke="#1baf7a" stroke-width="2.5" />
    <rect x="444" y="176" width="300" height="32" rx="6" fill="#c6ebde" stroke="#1baf7a" stroke-width="2.5" />
    <rect x="444" y="218" width="300" height="32" rx="6" fill="#c6ebde" stroke="#1baf7a" stroke-width="2.5" />
    <rect x="444" y="260" width="300" height="32" rx="6" fill="#c6ebde" stroke="#1baf7a" stroke-width="2.5" />
  </g>

  <text x="594" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Endpoint.cs</text>
  <text x="594" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Request.cs</text>
  <text x="594" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Validator.cs</text>
  <text x="594" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">Handler.cs</text>
  <text x="594" y="281" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">DiscountRules.cs</text>

  <text x="30" y="332" font-size="13" font-style="italic" fill="#52514e">Same feature, same amount of code. Onion spreads it across rings; vertical slice keeps it in one place.</text>
</svg>

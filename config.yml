baseURL: "https://russfrith.com"
languageCode: en-us
title: Russell ‘Russ’ Frith
theme: PaperMod
env: production

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

params:
  label:
    icon: "/images/logo/logo-color-dark.svg"
    iconHeight: 35

  homeInfoParams:
    Title: "Hi, I'm Russ"
    Content: I'm a software developer with enough years in to have made most of the classic mistakes, and some that aren't in the books. I write about what I've learned and the ones I keep making, so you can skip a few of them. If you code, you'll make your own anyway, and you're welcome to learn alongside me.

  socialIcons:
    - name: email
      url: "mailto:russell@russfrith.com"
    - name: x
      url: "https://twitter.com/russfrith"
    - name: linkedin
      url: "https://www.linkedin.com/in/russellfrith/"
    - name: github
      url: "https://github.com/russfrith"  
    - name: rss
      url: "https://russfrith.com/index.xml"
  
  ShowReadingTime: true
  ShowShareButtons: true
  ShowFullTextinRSS: true

menu:
  main:
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
